spring.application.name=medicine-access-hub-backend
server.port=8081
# ---------------------------------------------------------------------------
# Database configuration (PostgreSQL / PostGIS)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/medicine_access_hub
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate configuration
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Flyway configuration
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------------
# JWT configuration
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:medicine-access-hub-super-secret-key-min-256-bits-for-hmac-sha}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ---------------------------------------------------------------------------
# CORS configuration
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------------------------------------------------------------------------
# Async thread pool (used for OTP / welcome email dispatch)
# ---------------------------------------------------------------------------
async.core-pool-size=4
async.max-pool-size=16
async.queue-capacity=200
async.thread-name-prefix=medaccesshub-async-

# ---------------------------------------------------------------------------
# Mail (SMTP) configuration
# ---------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME:your_smtp_username}
spring.mail.password=${SMTP_PASSWORD:your_smtp_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.medicineaccesshub=DEBUG

# ---------------------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
